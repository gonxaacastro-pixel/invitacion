<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi invitación</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background: #111;
            color: white;
        }

        .pantalla {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .contenido {
            animation: aparecer 2s ease;
        }

        .pequeno {
            font-size: 18px;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 55px;
            font-weight: normal;
            margin-bottom: 20px;
        }

        .frase {
            font-size: 20px;
            opacity: 0.85;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 40px;
            }

            .pequeno {
                font-size: 14px;
            }

            .frase {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <section class="pantalla">

        <div class="contenido">

            <div class="pequeno">
                UNA FECHA ESPECIAL
            </div>

            <h1>
                Nuestra Invitación
            </h1>

            <div class="frase">
                Tenemos algo muy especial para compartir con vos
            </div>

        </div>

    </section>

</body>
</html>
