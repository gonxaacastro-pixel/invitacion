<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi invitación</title>
    
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <section class="pantalla">

        <div class="contenido">

            <div class="pequeno">
                UNA FECHA ESPECIAL
            </div>

            <h1>
                Nuestra Invitación
            </h1>

            <div class="frase">
                Tenemos algo muy especial para compartir con vos
            </div>

        </div>

    </section>
    <section class="contador-seccion">

    <div class="contador-contenido">

        <p class="contador-titulo">
            FALTAN
        </p>

        <div id="contador">

            <div class="tiempo">
                <span id="dias">00</span>
                <small>DÍAS</small>
            </div>

            <div class="tiempo">
                <span id="horas">00</span>
                <small>HORAS</small>
            </div>

            <div class="tiempo">
                <span id="minutos">00</span>
                <small>MINUTOS</small>
            </div>

            <div class="tiempo">
                <span id="segundos">00</span>
                <small>SEGUNDOS</small>
            </div>

        </div>

    </div>

</section>
<script src="js/invitacion.js"></script>
</body>
</html>
